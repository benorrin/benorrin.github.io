                <circle class="buoy-light" cx="60" cy="14" r="7"/>
                <rect x="56" y="20" width="8" height="24" rx="2" fill="#3a3330"/>
                <g clip-path="url(#buoy-body)">
                    <rect x="0" y="40" width="120" height="130" fill="#e0603c"/>

<script>
    // Easter egg: poke the buoy
    document.querySelector('.buoy').addEventListener('click', (e) => {
        const inner = e.currentTarget.querySelector('.buoy-inner');
        inner.classList.remove('is-splashing');
        void inner.offsetWidth;
        inner.classList.add('is-splashing');
    });
</script>

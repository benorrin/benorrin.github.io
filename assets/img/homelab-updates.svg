<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">
  <title id="t">From a floating tag to an automated update flow</title>
  <desc id="d">The tag uptime-kuma:latest is crossed out and replaced with uptime-kuma:2.5.9. Below it, Renovate opens a PR, which either merges itself or waits for me, then lands on main and redeploys the changed stacks.</desc>

  <rect width="1000" height="490" fill="#1b1a18"/>

  <!-- The tag swap -->
  <text x="66" y="107" font-size="34" fill="#a8a29e" textLength="368" lengthAdjust="spacingAndGlyphs">uptime-kuma:latest</text>
  <line x1="56" y1="96" x2="444" y2="96" stroke="#f0805e" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 96 H522" fill="none" stroke="#a8a29e" stroke-width="3"/>
  <path d="M534 96 L518 87 V105 Z" fill="#a8a29e"/>
  <text x="757" y="107" font-size="34" font-weight="700" fill="#f0805e" text-anchor="middle">uptime-kuma:2.5.9</text>

  <line x1="45" y1="165" x2="955" y2="165" stroke="#2e2b28" stroke-width="2"/>

  <!-- Connectors -->
  <g fill="none" stroke="#a8a29e" stroke-width="3">
    <path d="M235 340 H260 V280 H274"/>
    <path d="M260 340 V400 H274" stroke="#f0805e" stroke-dasharray="7 6"/>
    <path d="M535 280 H560 V340 H574"/>
    <path d="M535 400 H560 V340" stroke="#f0805e" stroke-dasharray="7 6"/>
    <path d="M715 340 H754"/>
  </g>
  <path d="M285 280 L271 272 V288 Z" fill="#a8a29e"/>
  <path d="M285 400 L271 392 V408 Z" fill="#f0805e"/>
  <path d="M585 340 L571 332 V348 Z" fill="#a8a29e"/>
  <path d="M765 340 L751 332 V348 Z" fill="#a8a29e"/>

  <!-- Renovate -->
  <rect x="45" y="295" width="190" height="90" rx="10" fill="#26241f" stroke="#3a3632" stroke-width="2"/>
  <text x="140" y="333" font-size="24" font-weight="700" fill="#f2efec" text-anchor="middle">Renovate</text>
  <text x="140" y="364" font-size="18" fill="#a8a29e" text-anchor="middle">opens a PR</text>

  <!-- Merges itself -->
  <rect x="285" y="235" width="250" height="90" rx="10" fill="#26241f" stroke="#3a3632" stroke-width="2"/>
  <text x="410" y="273" font-size="24" font-weight="700" fill="#f2efec" text-anchor="middle">merges itself</text>
  <text x="410" y="304" font-size="18" fill="#a8a29e" text-anchor="middle">patch and minor</text>

  <!-- Waits for me -->
  <rect x="285" y="355" width="250" height="90" rx="10" fill="#26241f" stroke="#f0805e" stroke-width="2"/>
  <text x="410" y="393" font-size="24" font-weight="700" fill="#f0805e" text-anchor="middle">waits for me</text>
  <text x="410" y="424" font-size="18" fill="#a8a29e" text-anchor="middle">major and risky</text>

  <!-- main -->
  <rect x="585" y="295" width="130" height="90" rx="10" fill="#26241f" stroke="#3a3632" stroke-width="2"/>
  <text x="650" y="349" font-size="24" font-weight="700" fill="#f2efec" text-anchor="middle">main</text>

  <!-- Redeploy -->
  <rect x="765" y="295" width="190" height="90" rx="10" fill="#26241f" stroke="#3a3632" stroke-width="2"/>
  <text x="860" y="333" font-size="24" font-weight="700" fill="#f2efec" text-anchor="middle">redeploy</text>
  <text x="860" y="364" font-size="18" fill="#a8a29e" text-anchor="middle">changed stacks</text>
</svg>

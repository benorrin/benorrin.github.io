<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="A pegboard of hand tools, each with a small tag naming a utility" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">
  <defs><pattern id="h" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="4" fill="#d8ae86"/></pattern></defs>
  <rect width="1000" height="490" fill="#efcfae"/>
  <rect width="1000" height="440" fill="url(#h)"/>
  <rect y="440" width="1000" height="50" fill="#44403c"/>
  <rect y="440" width="1000" height="8" fill="#5b544d"/>

  <!-- Hammer -->
  <rect x="159" y="100" width="22" height="272" rx="6" fill="#8a5a3c" stroke="#1c1917" stroke-width="3"/>
  <path d="M112 66 H226 V112 Q226 128 210 128 H112 Z" fill="#44403c" stroke="#1c1917" stroke-width="3"/>
  <line x1="170" y1="372" x2="170" y2="388" stroke="#1c1917" stroke-width="2"/><rect x="90" y="388" width="160" height="38" rx="5" fill="#fffaf4" stroke="#1c1917" stroke-width="2"/><text x="170" y="414" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">lint</text>

  <!-- Spanner -->
  <rect x="376" y="130" width="28" height="222" fill="#7d8791" stroke="#1c1917" stroke-width="3"/>
  <path d="M368 56 A58 58 0 1 0 412 56 V104 H368 Z" fill="#7d8791" stroke="#1c1917" stroke-width="3"/>
  <circle cx="390" cy="350" r="30" fill="#7d8791" stroke="#1c1917" stroke-width="3"/>
  <circle cx="390" cy="350" r="12" fill="#efcfae" stroke="#1c1917" stroke-width="3"/>
  <line x1="390" y1="372" x2="390" y2="388" stroke="#1c1917" stroke-width="2"/><rect x="310" y="388" width="160" height="38" rx="5" fill="#fffaf4" stroke="#1c1917" stroke-width="2"/><text x="390" y="414" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">update.sh</text>

  <!-- Screwdriver -->
  <rect x="602" y="190" width="16" height="140" fill="#b4bcc4" stroke="#1c1917" stroke-width="3"/>
  <path d="M602 330 H618 L613 362 H607 Z" fill="#b4bcc4" stroke="#1c1917" stroke-width="3"/>
  <rect x="582" y="66" width="56" height="128" rx="20" fill="#e0603c" stroke="#1c1917" stroke-width="3"/>
  <path d="M598 84 V176 M610 84 V176 M622 84 V176" stroke="#c24a28" stroke-width="5"/>
  <line x1="610" y1="372" x2="610" y2="388" stroke="#1c1917" stroke-width="2"/><rect x="530" y="388" width="160" height="38" rx="5" fill="#fffaf4" stroke="#1c1917" stroke-width="2"/><text x="610" y="414" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">floorplan</text>

  <!-- Paintbrush -->
  <rect x="819" y="66" width="22" height="176" rx="10" fill="#3f6f7a" stroke="#1c1917" stroke-width="3"/>
  <rect x="810" y="236" width="40" height="36" fill="#b4bcc4" stroke="#1c1917" stroke-width="3"/>
  <path d="M810 272 H850 L858 356 Q830 372 802 356 Z" fill="#e2a64f" stroke="#1c1917" stroke-width="3"/>
  <line x1="830" y1="372" x2="830" y2="388" stroke="#1c1917" stroke-width="2"/><rect x="750" y="388" width="160" height="38" rx="5" fill="#fffaf4" stroke="#1c1917" stroke-width="2"/><text x="830" y="414" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">board</text>
</svg>
